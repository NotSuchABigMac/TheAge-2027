<!DOCTYPE html>
<html lang="en" data-theme="green" data-mode="dark">
<head>

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c1d14">

     @font-face rules and --display/--body/--mono variables this page
     uses; a separate Google Fonts round-trip here would just be the

<!-- Issue #187: rotating big-screen leaderboard for the clubhouse TV --
     dark-only by design (a TV, not a themeable page), so theme.js/site.js
     aren't loaded here -- their shared default would fight this page's

<style>
/* Same fixed hex as scorecard-live.html's --team-a/--team-b (issue #186's
   Wonga Wire and the match-card win borders there) -- kept in sync by eye
   since this page has no build step to share the values from a single
   source, but they're deliberately never theme-swapped on either page. */
:root { --team-a: #f472b6; --team-b: #6ab8f7; }
html, body { height: 100%; overflow: hidden; background: var(--canvas); }
body.tv-page {
  display: flex;
  flex-direction: column;
  font-family: var(--body);
}
.tv-hero {
  flex: 0 0 auto;
  text-align: center;
  padding: clamp(14px, 2.6vh, 32px) 24px clamp(10px, 1.8vh, 20px);
  border-bottom: 1.5px solid var(--rule-strong);
}
.tv-kicker {
  font-family: var(--mono);
  font-size: clamp(.7rem, 1.4vw, .95rem);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-2);
  margin-bottom: 4px;
}
.tv-score-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: clamp(12px, 3vw, 36px);
  font-family: var(--display);
}
.tv-team-name {
  font-size: clamp(1.3rem, 3.6vw, 2.6rem);
  font-weight: 500;
  max-width: 32vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tv-points {
  font-size: clamp(2.2rem, 7.5vw, 5.6rem);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.tv-status {
  margin-top: 6px;
  font-size: clamp(.8rem, 1.5vw, 1.05rem);
  color: var(--ink-mute);
}
.tv-stage {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
}
.tv-screen {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: clamp(8px, 1.5vh, 20px) 0 40px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .6s ease;
}
.tv-screen.tv-screen-active {
  opacity: 1;
  visibility: visible;
}
@media (prefers-reduced-motion: reduce) {
  .tv-screen { transition: none; }
  .tv-wire-text { transition: none; }
}
.tv-screen-title {
  max-width: 900px;
  margin: 0 auto 12px;
  padding: 0 24px;
  font-family: var(--mono);
  font-size: clamp(.7rem, 1.3vw, .9rem);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-2);
  text-align: center;
}
.tv-day {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px 24px;
}
.tv-day + .tv-day { border-top: 1px solid var(--rule); }
.tv-day-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.tv-day-title {
  font-family: var(--display);
  font-size: clamp(1.1rem, 2.2vw, 1.6rem);
  font-weight: 600;
}
.tv-day-total {
  font-family: var(--mono);
  font-size: .95rem;
  color: var(--ink-mute);
  white-space: nowrap;
}
.tv-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  font-size: clamp(.95rem, 1.6vw, 1.25rem);
  border-top: 1px solid var(--rule);
}
.tv-row:first-of-type { border-top: none; }
.tv-row .side {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tv-row .side.right { text-align: right; }
.tv-row .mid {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: .82em;
  color: var(--accent-2);
  min-width: 6em;
  text-align: center;
}
.tv-status-badge {
  display: inline-block;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
}
.tv-status-badge.tv-badge-a { color: var(--team-a); background: color-mix(in srgb, var(--team-a) 18%, transparent); }
.tv-status-badge.tv-badge-b { color: var(--team-b); background: color-mix(in srgb, var(--team-b) 18%, transparent); }
.tv-status-badge.tv-badge-neutral { color: var(--ink-mute); background: color-mix(in srgb, var(--ink-mute) 14%, transparent); }
.tv-status-sub {
  display: block;
  font-size: .78em;
  color: var(--ink-mute);
  margin-top: 2px;
}
.tv-empty {
  color: var(--ink-mute);
  font-style: italic;
  padding: 6px 0;
}
.tv-margin {
  max-width: 900px;
  margin: 4px auto 18px;
  padding: 0 24px;
  text-align: center;
  font-family: var(--display);
  font-size: clamp(1.1rem, 2.6vw, 1.9rem);
  color: var(--gold, var(--accent-2));
}
.tv-dots {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding-top: 6px;
}
.tv-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rule-strong);
  transition: background .3s ease, transform .3s ease;
}
.tv-dot.tv-dot-active { background: var(--accent-2); transform: scale(1.3); }
.tv-wire {
  flex: 0 0 auto;
  padding: 6px 24px;
  text-align: center;
  font-family: var(--mono);
  font-size: clamp(.72rem, 1.3vw, .9rem);
  color: var(--ink);
  border-top: 1px solid var(--rule);
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity .5s ease;
}
.tv-wire.tv-wire-visible { opacity: 1; max-height: 3em; padding: 6px 24px; }
.tv-wire-text { transition: opacity .4s ease; }
.tv-wire-text::before { content: "\25CF  "; color: var(--accent-2); }
.tv-foot {
  flex: 0 0 auto;
  padding: 8px 24px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-mute);
  border-top: 1px solid var(--rule);
}
.tv-course-card {
  max-width: 900px;
  margin: 0 auto 14px;
  padding: 0 24px;
}
.tv-course-photo {
  height: clamp(90px, 16vh, 190px);
  border-radius: 10px;
  background-size: cover;
  background-position: center;
  border: 1px solid var(--rule-strong);
}
.tv-course-name {
  font-family: var(--display);
  font-size: clamp(1.05rem, 2.2vw, 1.5rem);
  font-weight: 600;
  margin: 8px 0 2px;
}
.tv-course-format {
  font-size: clamp(.82rem, 1.4vw, 1rem);
  color: var(--ink-mute);
}
.tv-trophy {
  max-width: 700px;
  margin: 4vh auto 0;
  padding: 0 24px;
  text-align: center;
}
.tv-trophy-emoji { font-size: clamp(2.4rem, 7vw, 4.5rem); }
.tv-trophy-winner {
  font-family: var(--display);
  font-size: clamp(1.6rem, 4.5vw, 3rem);
  font-weight: 600;
  margin: 6px 0;
}
.tv-trophy-score {
  font-family: var(--mono);
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--ink-mute);
}
</style>

<body class="tv-page">

<header class="tv-hero">
  <div class="tv-kicker">The Wonga Cup &middot; MMXXVI</div>
  <div class="tv-score-row">
    <span class="tv-team-name" id="tv-team-a">Team A</span>
    <span class="tv-points" id="tv-points">&ndash; &ndash;</span>
    <span class="tv-team-name" id="tv-team-b">Team B</span>
  </div>
  <div class="tv-status" id="tv-status">Loading&hellip;</div>
</header>

<main class="tv-stage">
  <section class="tv-screen tv-screen-active" id="screen-cup">
    <div class="tv-screen-title">The Cup</div>
    <div id="cup-margin" class="tv-margin"></div>
    <div id="cup-board"><div class="tv-empty">Loading&hellip;</div></div>
  </section>
  <section class="tv-screen" id="screen-live">
    <div class="tv-screen-title" id="live-title">Live</div>
    <div id="live-board"><div class="tv-empty">Loading&hellip;</div></div>
  </section>
  <section class="tv-screen" id="screen-ntp">
    <div class="tv-screen-title">Nearest the Pin</div>
    <div id="ntp-board"><div class="tv-empty">Loading&hellip;</div></div>
  </section>
</main>

<div class="tv-dots" id="tv-dots" aria-hidden="true"></div>
<div class="tv-wire" id="tv-wire"><span class="tv-wire-text" id="tv-wire-text"></span></div>
<footer class="tv-foot">The Wonga Cup &middot; Fourth Edition &middot; 2026</footer>

<script src="error-beacon.js?v=__CACHEBUST__"></script>
<script src="courses.js?v=__CACHEBUST__"></script>
<script src="players.js?v=__CACHEBUST__"></script>
<script src="scoring.js?v=__CACHEBUST__"></script>
<script>
(function () {
  const teamAEl = document.getElementById('tv-team-a');
  const teamBEl = document.getElementById('tv-team-b');
  const pointsEl = document.getElementById('tv-points');
  const statusEl = document.getElementById('tv-status');
  const cupMarginEl = document.getElementById('cup-margin');
  const cupBoardEl = document.getElementById('cup-board');
  const liveTitleEl = document.getElementById('live-title');
  const liveBoardEl = document.getElementById('live-board');
  const ntpBoardEl = document.getElementById('ntp-board');
  const dotsEl = document.getElementById('tv-dots');
  const wireEl = document.getElementById('tv-wire');
  const wireTextEl = document.getElementById('tv-wire-text');
  if (typeof WongaScoring === 'undefined' || typeof WongaCourses === 'undefined' || typeof WongaPlayers === 'undefined') return;

  const {
    phaseFor, daysUntilDay1, defaultDay,
    normalizeState, processUpdateRows, applyUpdateToState, describeEvent,
    computeSeasonTotals, resolveOverallWinner, playersWithOverrides,
    effectiveMatchFor, matchPoints, day1StrokeIndexesFor, matchStrokesForPlayers, holeResult,
    day2CourseHolesFor, day2GroupHandicapFor, groupStrokes, scrambleNetToParThru,
    day3PointsThruFor,
    parseScoreToPar,
    teamOfSets, computeStableford, escapeHtml
  } = WongaScoring;
  const { COURSES, NTP_HOLES } = WongaCourses;
  const { PLAYERS } = WongaPlayers;

  // Read-only anon key, same one already shipped in scorecard-live.html /
  // ribbon-status.js -- RLS is the access boundary, not this key (see
  // ARCHITECTURE.md). No login, no writes: this page never needs a
  // write_token.
  const SUPABASE_URL = 'https://wtyyarvyscbrrkawjcvo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_T1z1rYbZ7yMoDdBXZMrjKw_R3aTxsrx';
  const TOURNAMENT_ID = 'wonga-cup-2026';
  const SAFE_SELECT_COLUMNS = 'id,tournament_id,update_type,match_idx,player_id,field_key,value,updated_by,updated_at';
  const DAY_LABELS = { day1: 'Day 1', day2: 'Day 2', day3: 'Day 3' };
  const NTP_DAY_TITLES = { day1: 'Day 1 · Murray', day2: 'Day 2 · Black Bull', day3: 'Day 3' };
  const NTP_DAY_FIELDS = { day1: ['h8', 'h17'], day2: ['h4', 'h16'], day3: ['h7', 'h14'] };
  const NTP_DAY_COURSE = { day1: 1, day2: 2, day3: 3 };
  // Same photos + format copy as index.html's course cards (#the-cup
  // section), condensed to one line each -- kept in sync by eye, same as
  // --team-a/--team-b above, since this page has no shared-partial system.
  const DAY_COURSE_META = {
    day1: { photo: 'images/course-murray.webp', name: 'The Murray Course', format: 'Singles Match Play · six 1v1 matches, front &amp; back 9 each worth 1pt' },
    day2: { photo: 'images/course-black-bull.webp', name: 'Black Bull', format: 'Team Scramble · 4v4 &amp; 3v3 groups score the differential, best combined total wins a 5pt bonus' },
    day3: { photo: 'images/course-lake.jpg', name: 'The Lake Course', format: 'Individual Net Stableford · 14 players, points by finishing position' }
  };

  function fmt(n) {
    return n === Math.floor(n) ? n.toString() : n.toFixed(1);
  }
  function playerName(id) {
    const p = PLAYERS.find(p => p.id === id);
    return p ? p.short : '—';
  }
  function netToParLabel(v) {
    if (v === null || v === undefined || v === '') return '—';
    const n = parseInt(v, 10);
    if (isNaN(n)) return '—';
    if (n === 0) return 'E';
    return n > 0 ? `+${n}` : `${n}`;
  }

  // Same deliberately-simpler full-refresh read ribbon-status.js uses --
  // this is read-only display, not the scoring source of truth, so a
  // from-epoch replay every poll is fine at this data volume.
  async function fetchAllRows() {
    const rows = [];
    let cursor = '1970-01-01T00:00:00.000Z';
    while (true) {
      const url = `${SUPABASE_URL}/rest/v1/tournament_updates?select=${SAFE_SELECT_COLUMNS}&tournament_id=eq.${TOURNAMENT_ID}&updated_at=gte.${encodeURIComponent(cursor)}&order=updated_at.asc,id.asc&limit=500`;
      const resp = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' } });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const page = await resp.json();
      rows.push(...page);
      if (page.length < 500) break;
      cursor = page[page.length - 1].updated_at;
    }
    return rows;
  }

  // Same describeEvent() classification scorecard-live.html's Wonga Wire
  // (issue #186) uses, but rebuilt from scratch on every refresh() rather
  // than kept incrementally -- this page already does a from-epoch replay
  // every poll (see fetchAllRows()' comment), so there's no persistent
  // "state so far" to update incrementally in the first place, and this
  // is a read-only display, not the wire's own toast/notification system,
  // so there's no own-echo or page-load filtering to do either.
  const WIRE_FEED_MAX = 8;
  function replayState(rows) {
    const state = { teamNameA: 'Team A', teamNameB: 'Team B', teamA: new Set(), teamB: new Set() };
    normalizeState(state);
    const wire = [];
    processUpdateRows(rows, (row) => {
      let prevMatchSnapshot = null;
      if (row.update_type === 'day1_hole' && typeof row.match_idx === 'number' && state.day1.matches[row.match_idx]) {
        prevMatchSnapshot = JSON.parse(JSON.stringify(state.day1.matches[row.match_idx]));
      }
      applyUpdateToState(state, row);
      const prevState = prevMatchSnapshot
        ? { day1: { matches: { [row.match_idx]: prevMatchSnapshot } } }
        : state;
      const players = playersWithOverrides(PLAYERS, state.hcp);
      const event = describeEvent(row, prevState, state, players, COURSES, { A: state.teamNameA, B: state.teamNameB });
      if (event) wire.unshift({ ...event, at: row.updated_at });
    });
    if (wire.length > WIRE_FEED_MAX) wire.length = WIRE_FEED_MAX;
    return { state, wire };
  }

  function renderStatus(totals, state) {
    const phase = phaseFor(new Date());
    if (phase === 'countdown') {
      const days = daysUntilDay1(new Date());
      statusEl.textContent = days <= 0 ? 'Kicks off today' : `Kicks off in ${days === 1 ? '1 day' : days + ' days'}`;
      return;
    }
    if (phase === 'live') {
      const dayLabel = DAY_LABELS[defaultDay(new Date())] || '';
      statusEl.textContent = dayLabel ? `${dayLabel} in play` : 'Live';
      return;
    }
    const result = resolveOverallWinner(totals.totalA, totals.totalB, state.tiebreak);
    if (result.winner === 'A') statusEl.textContent = `🏆 ${state.teamNameA} win`;
    else if (result.winner === 'B') statusEl.textContent = `🏆 ${state.teamNameB} win`;
    else statusEl.textContent = 'Tied — tiebreak pending';
  }

  // ── SCREEN 1: THE CUP -- day-by-day breakdown + margin line. There's
  // no well-defined "needs X to clinch" here (Day 2's group differential
  // scoring has no fixed ceiling to count down from, unlike a fixed
  // 1-point-per-match format), so this shows the actual point margin
  // instead -- still the single number that matters most on a big
  // screen at a glance.
  function renderCup(totals, state) {
    cupBoardEl.innerHTML = [
      daySection('Day 1 · Match Play', `${fmt(totals.day1.a)} – ${fmt(totals.day1.b)}`, ''),
      daySection('Day 2 · Scramble', `${fmt(totals.day2.a)} – ${fmt(totals.day2.b)}`, ''),
      daySection('Day 3 · Stableford', `${fmt(totals.day3.a)} – ${fmt(totals.day3.b)}`, '')
    ].join('');
    const diff = totals.totalA - totals.totalB;
    if (diff === 0) {
      cupMarginEl.textContent = 'All square';
    } else {
      const leaderName = diff > 0 ? state.teamNameA : state.teamNameB;
      cupMarginEl.textContent = `${leaderName} leads by ${fmt(Math.abs(diff))}`;
    }
  }

  // ── SCREEN 2: LIVE DAY -- whichever day is actually in play, with
  // thru-N detail per the issue's own spec, rather than just the final
  // points every other screen already shows.
  // Structured progress for one Day 1 match -- `thru` is holes played
  // across BOTH nines (not just the nine in progress), so the leaderboard
  // below can sort every match, live or finished, on one consistent
  // "how far through" number. `team` is the nine-in-progress leader ('A'/
  // 'B'/null for all-square), used to color the status badge; a finished
  // match colors on which side actually won that nine's point instead.
  function matchProgress(match, players, si, course) {
    const eff = effectiveMatchFor(match, players, si, course);
    const pts = matchPoints(eff);
    if (eff.front9 !== null && eff.back9 !== null) {
      const team = pts.a === pts.b ? null : (pts.a > pts.b ? 'A' : 'B');
      return { thru: 18, team, label: team ? 'Won' : 'Halved', sub: `${fmt(pts.a)} – ${fmt(pts.b)}` };
    }
    if (!Array.isArray(match.holesA) || !Array.isArray(match.holesB)) {
      return { thru: 0, team: null, label: '—', sub: '' }; // manual-only, no hole data to derive progress from
    }
    const strokes = matchStrokesForPlayers(match, players, si, course);
    const results = match.holesA.map((g, i) => holeResult(g, match.holesB[i], strokes.a[i], strokes.b[i]));
    const thru = results.filter(r => r !== null).length;
    if (thru === 0) return { thru: 0, team: null, label: 'Not started', sub: '' };
    const nine = eff.front9 === null ? { start: 0, label: 'Front 9' } : { start: 9, label: 'Back 9' };
    const nineResults = results.slice(nine.start, nine.start + 9);
    const nineThru = nineResults.filter(r => r !== null).length;
    const wonA = nineResults.filter(r => r === 'A').length;
    const wonB = nineResults.filter(r => r === 'B').length;
    const lead = Math.abs(wonA - wonB);
    const team = lead === 0 ? null : (wonA > wonB ? 'A' : 'B');
    return { thru, team, label: lead === 0 ? 'A/S' : `${lead}UP`, sub: `${nine.label} thru ${nineThru}` };
  }

  // Leaderboard, not match order: the pairs furthest into their round lead
  // the list, ties broken by original draw order -- a spectator glancing
  // at the TV wants to know who's closest to a result, not who happens to
  // be match 1.
  function liveDay1Rows(state, players) {
    const si = day1StrokeIndexesFor(COURSES);
    return state.day1.matches
      .map((m, idx) => ({ m, idx, prog: matchProgress(m, players, si, COURSES[1]) }))
      .filter(({ m }) => m.pA[0] !== null || m.pB[0] !== null)
      .sort((x, y) => y.prog.thru - x.prog.thru || x.idx - y.idx)
      .map(({ m, prog }) => {
        const badgeClass = prog.team === 'A' ? 'tv-badge-a' : prog.team === 'B' ? 'tv-badge-b' : 'tv-badge-neutral';
        const sub = prog.sub ? `<span class="tv-status-sub">${escapeHtml(prog.sub)}</span>` : '';
        return `<div class="tv-row">
          <span class="side">${escapeHtml(playerName(m.pA[0]))}</span>
          <span class="mid"><span class="tv-status-badge ${badgeClass}">${escapeHtml(prog.label)}</span>${sub}</span>
          <span class="side right">${escapeHtml(playerName(m.pB[0]))}</span>
        </div>`;
      }).join('');
  }

  // Same net-to-par-thru-N math projectedDay2Field() (scoring.js) uses
  // for the live scorecard's own "if it ended right now" line (#260),
  // just also surfacing `played` here for the thru-N label.
  function liveDay2Field(code, day2, players) {
    const holes = day2.holes[code];
    if (!holes.some(h => h !== null)) return { label: netToParLabel(day2[code]), played: null };
    const handicap = day2GroupHandicapFor(code, day2, players, COURSES);
    if (handicap === null) return { label: '—', played: null };
    const courseHoles = day2CourseHolesFor(COURSES);
    const strokes = groupStrokes(handicap, courseHoles.map(h => h.si));
    const { netToPar, played } = scrambleNetToParThru(holes, strokes, courseHoles.map(h => h.par));
    return { label: netToParLabel(netToPar), played };
  }

  function liveDay2Rows(state, players, scramble) {
    const groups = state.day2.groups;
    const rows = [];
    [['4', 'a4', 'b4', scramble.four], ['3', 'a3', 'b3', scramble.three]].forEach(([size, aCode, bCode, pts]) => {
      if (!groups[aCode].length && !groups[bCode].length) return;
      const a = liveDay2Field(aCode, state.day2, players);
      const b = liveDay2Field(bCode, state.day2, players);
      const aThru = a.played !== null ? ` (thru ${a.played})` : '';
      const bThru = b.played !== null ? ` (thru ${b.played})` : '';
      rows.push(`<div class="tv-row">
        <span class="side">Group of ${size} · ${escapeHtml(state.teamNameA)}: ${a.label}${aThru}</span>
        <span class="mid">${fmt(pts.a)} – ${fmt(pts.b)}</span>
        <span class="side right">${escapeHtml(state.teamNameB)}: ${b.label}${bThru}</span>
      </div>`);
    });
    return rows.join('');
  }

  // Same "effective" shape as liveDay2Field() above: prefers hole-by-hole
  // data once any exists (a legacy manual 18-hole total is the only
  // no-hole-data shape, so it's always treated as 18 holes played). Returns
  // both the raw total (display) and points-per-hole average (ranking) --
  // the scorecard's leaderboard ranks on pace, not raw total, so this board
  // must never disagree with it about who's winning Day 3.
  function liveDay3Field(playerId, day3, players, courses) {
    const holes = day3.holes ? day3.holes[playerId] : null;
    if (!Array.isArray(holes) || !holes.some(h => h !== null)) {
      const total = parseScoreToPar(day3.scores[playerId]);
      return { total, perHole: total === null ? null : total / 18, played: null };
    }
    const result = day3PointsThruFor(playerId, day3, players, courses);
    if (result === null) return { total: null, perHole: null, played: null };
    const { total, played } = result;
    return { total, perHole: played > 0 ? total / played : null, played };
  }

  function liveDay3Rows(state, players) {
    const entries = PLAYERS.map(p => {
      const f = liveDay3Field(p.id, state.day3, players, COURSES);
      return { id: p.id, team: teamOfSets(p.id, state.teamA, state.teamB), score: f.perHole, total: f.total, played: f.played };
    });
    const sorted = computeStableford(entries).filter(e => e.score !== null);
    if (!sorted.length) return '';
    return sorted.map(e => {
      const thru = e.played !== null ? ` (thru ${e.played})` : '';
      return `<div class="tv-row">
      <span class="side">${e.pos}. ${escapeHtml(playerName(e.id))}</span>
      <span class="mid">${e.total} pts${thru}</span>
      <span class="side right">${fmt(e.pts)} pts</span>
    </div>`;
    }).join('');
  }

  function daySection(title, totalLabel, rowsHtml) {
    return `<section class="tv-day">
      <div class="tv-day-head">
        <span class="tv-day-title">${title}</span>
        <span class="tv-day-total">${totalLabel}</span>
      </div>
      ${rowsHtml || '<div class="tv-empty">Nothing entered yet</div>'}
    </section>`;
  }

  function courseCardHtml(dayKey) {
    const meta = DAY_COURSE_META[dayKey];
    return `<div class="tv-course-card">
      <div class="tv-course-photo" style="background-image:url('${meta.photo}')"></div>
      <div class="tv-course-name">${DAY_LABELS[dayKey]} &middot; ${meta.name}</div>
      <div class="tv-course-format">${meta.format}</div>
    </div>`;
  }

  function trophyHtml(totals, state, result) {
    if (result.winner === null) {
      return `<div class="tv-trophy">
        <div class="tv-trophy-emoji">🤝</div>
        <div class="tv-trophy-winner">All square</div>
        <div class="tv-trophy-score">${fmt(totals.totalA)} – ${fmt(totals.totalB)} &middot; tiebreak pending</div>
      </div>`;
    }
    const winnerName = result.winner === 'A' ? state.teamNameA : state.teamNameB;
    return `<div class="tv-trophy">
      <div class="tv-trophy-emoji">🏆</div>
      <div class="tv-trophy-winner">${escapeHtml(winnerName)}</div>
      <div class="tv-trophy-score">${fmt(totals.totalA)} – ${fmt(totals.totalB)}</div>
    </div>`;
  }

  // Phase-adaptive: the Live slot has nothing to rotate *into* before Day
  // 1 or after the Cup is decided (defaultDay() is null in both cases --
  // see phaseFor()'s own "live iff defaultDay isn't null" contract), so
  // rather than the old static "No round in play right now" filler, it
  // shows the upcoming format (countdown) or the final result (final)
  // instead -- always something worth a 15s dwell.
  function renderLive(totals, state, players) {
    const now = new Date();
    const phase = phaseFor(now);
    if (phase === 'countdown') {
      liveTitleEl.textContent = 'The Format';
      liveBoardEl.innerHTML = ['day1', 'day2', 'day3'].map(courseCardHtml).join('');
      return;
    }
    if (phase === 'final') {
      liveTitleEl.textContent = 'The Result';
      const result = resolveOverallWinner(totals.totalA, totals.totalB, state.tiebreak);
      liveBoardEl.innerHTML = trophyHtml(totals, state, result);
      return;
    }
    const day = defaultDay(now);
    liveTitleEl.textContent = `${DAY_LABELS[day]} · Live`;
    const card = courseCardHtml(day);
    if (day === 'day1') {
      liveBoardEl.innerHTML = card + daySection('Day 1 · Match Play', `${fmt(totals.day1.a)} – ${fmt(totals.day1.b)}`, liveDay1Rows(state, players));
    } else if (day === 'day2') {
      liveBoardEl.innerHTML = card + daySection('Day 2 · Scramble', `${fmt(totals.day2.a)} – ${fmt(totals.day2.b)}`, liveDay2Rows(state, players, totals.day2.scramble));
    } else {
      liveBoardEl.innerHTML = card + daySection('Day 3 · Stableford', `${fmt(totals.day3.a)} – ${fmt(totals.day3.b)}`, liveDay3Rows(state, players));
    }
  }

  // ── SCREEN 3: NEAREST THE PIN honours board.
  function renderNtp(state) {
    const ntpState = { day1: state.day1.ntp, day2: state.day2.ntp, day3: state.day3.ntp };
    ntpBoardEl.innerHTML = ['day1', 'day2', 'day3'].map((dayKey) => {
      const fields = NTP_DAY_FIELDS[dayKey];
      const holeNums = NTP_HOLES[NTP_DAY_COURSE[dayKey]];
      const rows = fields.map((field, i) => {
        const holderId = ntpState[dayKey][field];
        const holderName = holderId === null || holderId === undefined ? '—' : escapeHtml(playerName(holderId));
        return `<div class="tv-row">
          <span class="side">Hole ${holeNums[i]}</span>
          <span class="mid"></span>
          <span class="side right">${holderName}</span>
        </div>`;
      }).join('');
      return daySection(NTP_DAY_TITLES[dayKey], '', rows);
    }).join('');
  }

  // ── WONGA WIRE TICKER -- ambient "what just happened" strip, same
  // event classification as scorecard-live.html's Wonga Wire (issue
  // #186) but shown as a single cycling line rather than a scrollable
  // list, since a TV has no scrollbar a spectator can use. Cycles
  // independently of the 15s screen rotation so it stays legible even
  // while parked on one screen for a while.
  let wireFeed = [];
  let wireIndex = 0;
  function setWireFeed(feed) {
    wireFeed = feed;
    if (wireIndex >= wireFeed.length) wireIndex = 0;
    wireEl.classList.toggle('tv-wire-visible', wireFeed.length > 0);
    if (wireFeed.length > 0) wireTextEl.textContent = wireFeed[wireIndex].headline;
  }
  function rotateWire() {
    if (!wireFeed.length) return;
    wireIndex = (wireIndex + 1) % wireFeed.length;
    wireTextEl.style.opacity = 0;
    setTimeout(() => {
      wireTextEl.textContent = wireFeed[wireIndex].headline;
      wireTextEl.style.opacity = 1;
    }, 400);
  }
  setInterval(rotateWire, 6000);

  async function refresh() {
    const rows = await fetchAllRows();
    const { state, wire } = replayState(rows);
    // Issue #206: an admin's handicap override must reach every derived
    // score here too, same as the live scorecard's own currentPlayers() --
    // otherwise a corrected handicap silently disagrees between the two.
    const players = playersWithOverrides(PLAYERS, state.hcp);
    const totals = computeSeasonTotals(state, players, COURSES);
    teamAEl.textContent = state.teamNameA;
    teamBEl.textContent = state.teamNameB;
    pointsEl.textContent = `${fmt(totals.totalA)} – ${fmt(totals.totalB)}`;
    renderStatus(totals, state);
    renderCup(totals, state);
    renderLive(totals, state, players);
    renderNtp(state);
    setWireFeed(wire);
  }

  // Screen wake lock (issue #187) -- best-effort only, this is a display
  // meant to stay lit on a TV/tablet propped up in the corner. Silently
  // no-ops on browsers without the API rather than surfacing an error.
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try { await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });

  // Auto-rotating screens (issue #187), ~15s each with a CSS crossfade.
  // All three screens are always kept up to date by refresh() above,
  // whether or not they're the one currently visible, so rotating into
  // one never shows stale data from several polls ago.
  const SCREEN_IDS = ['screen-cup', 'screen-live', 'screen-ntp'];
  // Starts at 0 -- screen-cup is already the one marked active in the
  // static markup, so the first tick must advance past it, not
  // re-select it (an off-by-one that would otherwise sit on the Cup
  // screen for two full intervals before ever moving).
  let screenIndex = 0;
  function renderDots() {
    dotsEl.innerHTML = SCREEN_IDS.map((_, i) => `<span class="tv-dot${i === screenIndex ? ' tv-dot-active' : ''}"></span>`).join('');
  }
  function rotateScreen() {
    screenIndex = (screenIndex + 1) % SCREEN_IDS.length;
    const screens = SCREEN_IDS.map(id => document.getElementById(id));
    screens.forEach((el, i) => el.classList.toggle('tv-screen-active', i === screenIndex));
    renderDots();
  }
  renderDots();
  setInterval(rotateScreen, 15000);

  // 30s poll, matching the live scorecard's cadence. A failed refresh
  // (network blip, cast device asleep) just keeps showing the last good
  // render rather than clearing the screen.
  let everLoaded = false;
  async function tick() {
    try { await refresh(); everLoaded = true; }
    catch (e) {
      if (!everLoaded) {
        statusEl.textContent = 'Unable to load live scores';
        cupBoardEl.innerHTML = '<div class="tv-empty">Unable to load the scoreboard</div>';
        liveBoardEl.innerHTML = '<div class="tv-day"><div class="tv-empty">Unable to load the scoreboard</div></div>';
        ntpBoardEl.innerHTML = '<div class="tv-empty">Unable to load the scoreboard</div>';
      }
    }
    finally { setTimeout(tick, 30000); }
  }
  tick();
})();
</script>

</body>
</html>
