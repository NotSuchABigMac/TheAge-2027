<style>
/* Self-hosted font, the same file styles.css already ships (issue #197).
   Declared inline rather than pulling in the full 45KB design system --
   this page uses one family and nothing else. */
@font-face {
  font-family: 'Geist Mono';
  font-style: normal; font-weight: 100 900; font-display: swap;
  src: url('fonts/geist-mono.woff2') format('woff2');
}

:root {
  --bg: #0b1712;
  --ink: #ece5d5;
  --muted: #7f8d83;
  --accent: #c2a05e;
  --line: rgba(236, 229, 213, 0.10);
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;             /* the scene is the whole viewport; nothing scrolls */
  background: radial-gradient(120% 80% at 50% 45%, #12251b 0%, var(--bg) 65%);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}

/* The cart is painted on a full-viewport canvas sitting *behind* the
   wordmark, so "AGE 2027" stays real selectable text for a screen reader
   (and for the font stack) rather than being drawn into the bitmap. The
   circle is sized so the cart never crosses the text. */
#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.mark {
  position: relative;           /* above the canvas */
  margin: 0;
  /* Sized off the viewport height, like the circle is, so the wordmark
     always fits inside the cart's line with clearance -- a rem-based
     floor here would collide with the cart on a short landscape window. */
  font-size: clamp(0.4rem, 1.45vh, 0.95rem);
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink);
  /* letter-spacing adds a trailing gap that breaks optical centring */
  text-indent: 0.26em;
  user-select: none;
}
.mark .year { color: var(--accent); }

.back {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-indent: 0.22em;
  color: var(--muted);
  text-decoration: none;
  opacity: 0.55;
  border-bottom: 1px solid transparent;
  transition: opacity 0.2s, color 0.2s, border-color 0.2s;
}
.back:hover, .back:focus-visible { opacity: 1; color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<h1 class="mark">AGE <span class="year">2027</span></h1>

<a class="back" href="index.html">Home</a>

<script src="error-beacon.js?v=__CACHEBUST__"></script>
<script>
(function () {
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const TAU = Math.PI * 2;

    // ── Scene constants ────────────────────────────────────────────────
    // The brief: a circle roughly 20% of the vertical viewport. That's
    // the *diameter*, so the radius is half of it -- one constant, change
    // it here and the cart, the wheels and the skid marks all follow.
    const CIRCLE_VH   = 0.20;
    const LAP_SECONDS = 3.4;    // one lap of the circle
    const SLIP        = 0.42;   // radians of oversteer: how sideways the cart sits
    const SLIP_WOBBLE = 0.07;   // the drift breathes rather than being machined
    const TRAIL_MS    = 1500;   // how long a skid mark takes to fade out
    const TRAIL_STEP  = 3;      // css px between sampled trail points
    const TRAIL_BANDS = 14;     // fade steps along a mark (see drawTrails)

    const INK = '236, 229, 213';
    const ACCENT = '#c2a05e';
    // Two darks, because they sit on opposite grounds: a true tyre black
    // disappears into the deep green, so the wheels get a slate that reads
    // against the page, and only the details drawn on the cream roof get
    // to be properly dark.
    const TYRE = '#4a5a50';
    const DETAIL = '#1b2a22';

    // ── Cart geometry, in units of body length (nose at +x, local space) ──
    // Wheel order is fixed: 0/1 front, 2/3 rear. The rear pair lay down
    // the dark marks; the fronts only scuff, which is what reads as a
    // drift rather than a four-wheel skid.
    // The track is deliberately wider than the body (|y| > 0.5), so the
    // tyres sit proud of it -- from above, four dark stubs outside a gold
    // rectangle is most of what makes it read as a cart at 40px.
    const WHEELS = [
        { x:  0.30, y: -0.60, rear: false },
        { x:  0.30, y:  0.60, rear: false },
        { x: -0.31, y: -0.62, rear: true  },
        { x: -0.31, y:  0.62, rear: true  }
    ];

    // ── Live state ─────────────────────────────────────────────────────
    let VIEW_W = 0, VIEW_H = 0;
    let cx = 0, cy = 0;         // circle centre, css px
    let R = 0;                  // circle radius, css px
    let L = 0, W = 0;           // cart body length / width, css px

    let simTime = 0;            // ms of animation time (not wall clock)
    let lastFrame = 0;
    let rafId = 0;
    const trails = WHEELS.map(() => []);   // [{x, y, t}] per wheel, oldest first
    let dust = [];

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        VIEW_W = canvas.clientWidth;
        VIEW_H = canvas.clientHeight;
        cx = VIEW_W / 2;
        cy = VIEW_H / 2;
        R = (VIEW_H * CIRCLE_VH) / 2;

        // The cart is sized off the circle so the proportion holds at any
        // viewport, but clamped: below ~16px it stops reading as a cart,
        // and on a tall desktop window it shouldn't grow into the text.
        L = Math.max(16, Math.min(60, R * 0.52));
        W = L * 0.52;

        canvas.width = Math.round(VIEW_W * dpr);
        canvas.height = Math.round(VIEW_H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Marks laid down at the old radius would hang in space around the
        // new circle, so they're dropped and immediately re-seeded -- a
        // resize shouldn't wipe the trail the cart is visibly mid-way
        // through laying.
        for (const t of trails) t.length = 0;
        dust = [];
        seed();
        draw();
    }

    // Where the cart is at a given moment: a point on the circle, turned
    // sideways by the slip angle so the nose points inside the line it's
    // actually travelling.
    function cartAt(t) {
        const theta = (t / (LAP_SECONDS * 1000)) * TAU;
        const slip = SLIP + Math.sin(t / 620) * SLIP_WOBBLE;
        // The radius breathes a touch too, so the cart hunts for the line
        // the way a real one does instead of tracing a perfect compass arc.
        const r = R * (1 + Math.sin(t / 940) * 0.012);
        return {
            x: cx + Math.cos(theta) * r,
            y: cy + Math.sin(theta) * r,
            heading: theta + Math.PI / 2 + slip,   // travel direction + oversteer
            slip: slip
        };
    }

    function wheelPos(cart, w) {
        const c = Math.cos(cart.heading), s = Math.sin(cart.heading);
        const lx = w.x * L, ly = w.y * W;
        return { x: cart.x + lx * c - ly * s, y: cart.y + lx * s + ly * c };
    }

    // One simulation step. Drawing is separate so the same stepping can be
    // fast-forwarded to pre-fill the trails (see seed()).
    function step(dt) {
        simTime += dt;
        const cart = cartAt(simTime);

        for (let i = 0; i < WHEELS.length; i++) {
            const p = wheelPos(cart, WHEELS[i]);
            const trail = trails[i];
            const last = trail[trail.length - 1];
            // Sample by distance, not by frame: the mark stays the same
            // density on a 120Hz display as on a 30Hz one.
            if (!last || Math.hypot(p.x - last.x, p.y - last.y) >= TRAIL_STEP) {
                trail.push({ x: p.x, y: p.y, t: simTime });
            }
            while (trail.length && simTime - trail[0].t > TRAIL_MS) trail.shift();
        }

        // A little turf kicked off the rear wheels. Deliberately sparse --
        // enough to sell the slide, not enough to become weather.
        if (dust.length < 40 && Math.random() < dt / 55) {
            const w = WHEELS[2 + (Math.random() < 0.5 ? 0 : 1)];
            const p = wheelPos(cart, w);
            const a = Math.random() * TAU;
            const sp = (0.02 + Math.random() * 0.05) * L;
            dust.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: simTime });
        }
        for (let i = dust.length - 1; i >= 0; i--) {
            const d = dust[i];
            d.x += d.vx * (dt / 16.7);
            d.y += d.vy * (dt / 16.7);
            if (simTime - d.born > 620) dust.splice(i, 1);
        }

        return cart;
    }

    // Run the simulation forward one trail's worth without painting, so
    // the first painted frame already has skid marks behind the cart
    // instead of the cart appearing to start from a standstill.
    function seed() {
        const dt = 16.7;
        for (let i = 0; i < Math.ceil(TRAIL_MS / dt); i++) step(dt);
    }

    // A mark is stroked as a handful of contiguous polylines, one per fade
    // step -- *not* one stroke per sampled segment. Per-segment strokes
    // overlap at every joint, and semi-transparent overlaps accumulate, so
    // the mark comes out beaded like a dotted line. Butt caps and shared
    // endpoints between bands mean nothing is ever painted twice.
    function drawTrails() {
        ctx.lineCap = 'butt';
        ctx.lineJoin = 'round';
        for (let i = 0; i < trails.length; i++) {
            const trail = trails[i];
            if (trail.length < 2) continue;
            const rear = WHEELS[i].rear;
            const peak = rear ? 0.30 : 0.13;
            ctx.lineWidth = (rear ? 0.10 : 0.075) * L;

            const per = Math.max(2, Math.ceil(trail.length / TRAIL_BANDS));
            for (let s = 0; s < trail.length - 1; s += per - 1) {
                const e = Math.min(trail.length - 1, s + per - 1);
                const age = (simTime - trail[(s + e) >> 1].t) / TRAIL_MS;
                if (age >= 1) continue;
                // Squared falloff: the mark stays dark just behind the
                // wheel and thins out fast, rather than leaving an evenly
                // grey ring all the way round.
                ctx.strokeStyle = 'rgba(' + INK + ',' + (peak * (1 - age) * (1 - age)).toFixed(3) + ')';
                ctx.beginPath();
                ctx.moveTo(trail[s].x, trail[s].y);
                for (let j = s + 1; j <= e; j++) ctx.lineTo(trail[j].x, trail[j].y);
                ctx.stroke();
            }
        }
    }

    function drawDust() {
        for (const d of dust) {
            const age = (simTime - d.born) / 620;
            ctx.fillStyle = 'rgba(' + INK + ',' + (0.16 * (1 - age)).toFixed(3) + ')';
            ctx.beginPath();
            ctx.arc(d.x, d.y, Math.max(0.6, 0.022 * L), 0, TAU);
            ctx.fill();
        }
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fill();
    }

    function drawCart(cart) {
        // A soft shadow, offset in *world* space (down and right) so it
        // stays put as the cart rotates instead of swinging round with it.
        ctx.save();
        ctx.translate(cart.x + 0.05 * L, cart.y + 0.07 * L);
        ctx.rotate(cart.heading);
        ctx.fillStyle = 'rgba(4, 10, 7, 0.35)';
        roundRect(-L / 2, -W / 2, L, W, W * 0.22);
        ctx.restore();

        ctx.save();
        ctx.translate(cart.x, cart.y);
        ctx.rotate(cart.heading);

        // Wheels first, so the body sits over their inner ends. The front
        // pair are on opposite lock -- steering into the slide, which is
        // the detail that makes it read as a drift and not a spin.
        const steer = -cart.slip * 0.85;
        const wl = 0.20 * L, ww = 0.085 * L;
        ctx.fillStyle = TYRE;
        for (const w of WHEELS) {
            ctx.save();
            ctx.translate(w.x * L, w.y * W);
            if (!w.rear) ctx.rotate(steer);
            roundRect(-wl / 2, -ww / 2, wl, ww, ww * 0.35);
            ctx.restore();
        }

        // Bag rack off the back, then the chassis over it -- gold, and
        // visible as a rim around the roof, at the nose and across the tail.
        ctx.fillStyle = TYRE;
        roundRect(-0.60 * L, -0.30 * W, 0.14 * L, 0.60 * W, ww * 0.3);
        ctx.fillStyle = ACCENT;
        roundRect(-L / 2, -W / 2, L, W, W * 0.22);

        // Roof panel -- from above this is most of what you'd actually see.
        ctx.fillStyle = 'rgba(' + INK + ',0.92)';
        roundRect(-0.31 * L, -0.35 * W, 0.57 * L, 0.70 * W, W * 0.16);

        // Windscreen line and steering wheel, dark on the pale roof.
        ctx.fillStyle = DETAIL;
        ctx.fillRect(0.22 * L, -0.35 * W, 0.045 * L, 0.70 * W);
        ctx.beginPath();
        ctx.arc(0.10 * L, 0, 0.07 * L, 0, TAU);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);
        drawTrails();
        drawDust();
        drawCart(cartAt(simTime));
    }

    function frame(now) {
        // Clamped: coming back to a backgrounded tab hands you one huge
        // delta, which would teleport the cart and lay a chord straight
        // across the circle.
        const dt = Math.min(50, now - lastFrame || 16.7);
        lastFrame = now;
        step(dt);
        draw();
        rafId = requestAnimationFrame(frame);
    }

    function start() {
        cancelAnimationFrame(rafId);
        if (reduceMotion.matches) {
            // Reduced motion still gets the picture -- a cart parked
            // sideways with its marks behind it -- just no movement.
            draw();
            return;
        }
        lastFrame = 0;
        rafId = requestAnimationFrame(function first(now) { lastFrame = now; rafId = requestAnimationFrame(frame); });
    }

    window.addEventListener('resize', resize);
    if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', start);

    resize();
    start();

    // Test hook for test/repro-drift-page.mjs -- geometry and trail state
    // are otherwise only observable by pixel-peeping the canvas.
    window.__drift = {
        get radius() { return R; },
        get centre() { return { x: cx, y: cy }; },
        get cart() { return cartAt(simTime); },
        get cartLength() { return L; },
        get trailCounts() { return trails.map(t => t.length); },
        get reduced() { return reduceMotion.matches; },
        CIRCLE_VH: CIRCLE_VH
    };
})();
</script>

</body>
</html>
