name: Deploy to GitHub Pages

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Issue #26: this workflow used to run in parallel with test.yml, with
  # no dependency between them -- a push whose test job failed still
  # deployed, because the deploy job had no way to know the other
  # workflow even existed. test.yml's own `pull_request` trigger still
  # gates PRs, but this repeats the test run here so `deploy` below can
  # `needs: test` and actually block on it. Given this repo's context (a
  # live scorecard used from phones during play, where a bad deploy
  # reaches devices via the version.json refresh prompt) "the tests were
  # red but it shipped anyway" is worth closing off, even at the cost of
  # running the fast suite twice on an ordinary trunk push.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node --test test/*.test.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache-bust local CSS/JS references
        # HTML files reference local styles.css/scorecard.css/theme.js/
        # scoring.js with a "?v=__CACHEBUST__" placeholder (see each
        # <link>/<script> tag). Swap it for this commit's SHA on every
        # deploy so a browser/phone that cached an older version of one of
        # those files is forced to fetch the current one instead of running
        # stale JS against fresh HTML (or vice versa). sw.js (issue #205)
        # carries the same placeholder as its own cache-name version --
        # without its bytes changing every deploy too, the browser's own
        # "is there a new service worker" check would never notice a new
        # version exists, since that check is a byte diff against the
        # previously installed sw.js. Widened to *.js (issue #26) so any
        # __CACHEBUST__ reference landing in a .js file -- today just a
        # comment in site.js, but the glob shouldn't silently miss a real
        # one -- actually gets substituted; *.js already covers sw.js, so
        # it no longer needs listing separately.
        run: sed -i "s/__CACHEBUST__/${GITHUB_SHA::8}/g" *.html *.js

      - name: Write version.json
        # Issue #196: a fix pushed mid-tournament reaches ~none of the open
        # phones -- __CACHEBUST__ only helps a device that actually
        # reloads, and nobody reloads a tab they're mid-round on. The
        # scorecard polls this file and prompts to refresh on a mismatch
        # against its own baked-in version (same SHA, same sed above).
        run: echo "{\"v\":\"${GITHUB_SHA::8}\"}" > version.json

      - name: Assemble _site/
        # Issue #179: uploading the repo root used to publish the entire
        # repo -- test/, supabase/migrations/, README.md,
        # ARCHITECTURE.md, this workflow file, all of it, served publicly
        # at wongacup URLs. Nothing secret in any of it, but none of it
        # is site content either. An explicit copy list makes "what's on
        # the live site" something you can read here, rather than
        # "whatever happens to be in the repo root".
        run: |
          mkdir _site
          cp *.html *.js *.css *.mp3 CNAME version.json manifest.webmanifest _site/
          cp -r images _site/
          cp -r fonts _site/
          cp -r calendar _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
