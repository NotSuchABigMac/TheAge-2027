name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bare `node --test` auto-discovers every *.test.mjs under test/, so
      # a new test file can never silently drop out of CI (courses.test.mjs
      # was missed when only scoring.test.mjs was named here).
      - run: node --test
