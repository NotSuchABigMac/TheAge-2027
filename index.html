<style>
/* Self-hosted fonts, the same two files styles.css already ships (issue
   #197). Declared inline rather than pulling in the full 45KB design
   system -- this placeholder uses two families and nothing else. */
@font-face {
  font-family: 'Cormorant Garamond';
  font-style: normal; font-weight: 300 700; font-display: swap;
  src: url('fonts/cormorant-garamond.woff2') format('woff2');
}
@font-face {
  font-family: 'Geist Mono';
  font-style: normal; font-weight: 100 900; font-display: swap;
  src: url('fonts/geist-mono.woff2') format('woff2');
}

:root {
  --bg: #0b1712;
  --ink: #ece5d5;
  --muted: #7f8d83;
  --accent: #c2a05e;
  --line: rgba(236, 229, 213, 0.10);
  --display: 'Cormorant Garamond', Garamond, serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6vh 24px;
  background: radial-gradient(120% 80% at 50% 0%, #12251b 0%, var(--bg) 62%);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 840px;
  text-align: center;
}

.eyebrow {
  margin: 0 0 1.4rem;
  font-size: 0.66rem;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--muted);
  /* letter-spacing adds a trailing gap that breaks optical centring */
  text-indent: 0.42em;
}

h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(3rem, 12vw, 6rem);
  line-height: 0.95;
  letter-spacing: 0.01em;
}
h1 .year { color: var(--accent); }

.sub {
  margin: 1rem 0 0;
  font-size: 0.74rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--muted);
  text-indent: 0.26em;
}

.rule {
  width: 40px;
  height: 1px;
  margin: 2.6rem auto 2.2rem;
  background: var(--line);
}

canvas {
  display: block;
  width: 100%;
  height: 230px;          /* JS keeps this in step with the scene scale */
  background: transparent; /* the scene sits on the page gradient, not in a box */
  touch-action: manipulation;
}

.hint {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0.35rem 0.9rem;
  margin: 1.6rem 0 0;
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.hint .dot { opacity: 0.5; }
.hint a {
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  transition: color 0.2s, border-color 0.2s;
}
.hint a:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Below this the two halves stack, and the separator between them is
   just noise. */
@media (max-width: 460px) {
  .hint .dot { display: none; }
  .hint { flex-direction: column; }
}

kbd {
  font: inherit;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0.15em 0.45em;
}
</style>
</head>
<body>

<main class="wrap">

  <p class="eyebrow">Annual Golf Extravaganza</p>

  <h1>AGE <span class="year">2027</span></h1>
  <p class="sub">More info coming soon</p>

  <div class="rule"></div>

  <canvas id="gameCanvas"></canvas>

  <p class="hint">
    <span>Tap or press <kbd>Space</kbd> to jump</span>
    <span class="dot" aria-hidden="true">·</span>
    <a href="index2026.html">Relive 2026</a>
  </p>

</main>

<script src="error-beacon.js?v=__CACHEBUST__"></script>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // The scene is authored against an 800px-wide stage and scaled to
    // whatever width it actually gets. Everything below -- sprite size,
    // jump arc, scroll speed -- derives from that scale, so the game
    // plays identically on a phone instead of being the same 800px world
    // squeezed into 340px (which gave a phone under a second to react to
    // the first cart).
    const STAGE_W = 800;
    const STAGE_H = 230;
    const STAGE_GROUND = 190;
    // The cart sprite is authored on a 60x46 grid. The box is the full
    // sprite (wheels included) so the tyres sit *on* the ground line
    // rather than hanging through it.
    const SPRITE_W = 60;
    const SPRITE_H = 46;

    let S = 1;          // scene scale
    let VIEW_W = 800;   // css px
    let VIEW_H = 230;   // css px
    let GROUND = 190;   // css px
    let baseSpeed = 5;  // css px per frame at speed multiplier 1

    const INK = '#ece5d5';
    const MUTED = '#7f8d83';
    const ACCENT = '#c2a05e';
    const FONT_MONO = "'Geist Mono', ui-monospace, monospace";
    const FONT_DISPLAY = "'Cormorant Garamond', Garamond, serif";

    // Game Variables
    let frames = 0;
    let score = 0;
    let speedMult = 1;
    let isGameOver = false;
    let obstacles = [];
    let groundScroll = 0;

    // Cart palettes -- muted and near-monochrome, with the player picked
    // out in the site's gold and hazards in a desaturated clay. Three
    // body tones per cart (lit top, mid, shaded bottom) is what gives the
    // flat fillRect sprite any sense of volume.
    // Tyres are a slate/umber rather than near-black: against a #0b1712
    // page a true-black tyre just disappears and the cart reads as
    // floating on two little hubs.
    const CART_PLAYER = {
        roof: '#f4eee0', post: '#46564c', bodyLight: '#dbc189', body: ACCENT,
        bodyDark: '#96793f', wheel: '#2f3e36', hub: '#7d8b81',
        bag: '#38463d', bagTrim: '#8b9990'
    };
    const CART_HAZARD = {
        roof: '#a2937f', post: '#3b2f28', bodyLight: '#b85c48', body: '#9e4b3a',
        bodyDark: '#713327', wheel: '#3a2d27', hub: '#8a6a5b',
        bag: '#33261f', bagTrim: '#866d5e'
    };

    // Player Object
    const player = {
        x: 60, y: 150, width: SPRITE_W, height: SPRITE_H,
        dy: 0, jumpForce: -9.8, gravity: 0.4, grounded: true,
        jump() {
            if (this.grounded) {
                this.dy = this.jumpForce;
                this.grounded = false;
            }
        },
        update() {
            this.y += this.dy;
            if (this.y + this.height < GROUND) {
                this.dy += this.gravity;
                this.grounded = false;
            } else {
                this.dy = 0;
                this.grounded = true;
                this.y = GROUND - this.height; // Snap to ground
            }
        },
        draw() { drawCart(this.x, this.y, CART_PLAYER); }
    };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        VIEW_W = canvas.clientWidth || STAGE_W;
        // Floor the scale so the sprites stay readable on a narrow phone
        // rather than shrinking to a few pixels.
        S = Math.min(1, Math.max(0.62, VIEW_W / STAGE_W));
        VIEW_H = Math.round(STAGE_H * S);
        GROUND = Math.round(STAGE_GROUND * S);

        canvas.style.height = VIEW_H + 'px';
        canvas.width = Math.round(VIEW_W * dpr);
        canvas.height = Math.round(VIEW_H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        // Speed is proportional to the stage width, which is what keeps
        // the time between a cart appearing and reaching you constant at
        // any screen size.
        baseSpeed = VIEW_W / 110;

        player.width = SPRITE_W * S;
        player.height = SPRITE_H * S;
        player.x = 60 * S;
        // Lower gravity with a matching lower launch keeps the same apex
        // height but stretches the hang time, so the faster scroll below
        // doesn't demand tighter timing -- the arc covers ~5x the width
        // of a cart.
        player.jumpForce = -9.8 * S;
        player.gravity = 0.4 * S;
        if (player.grounded) player.y = GROUND - player.height;

        for (const o of obstacles) {
            o.width = SPRITE_W * S;
            o.height = SPRITE_H * S;
            o.y = GROUND - o.height;
        }

        // Setting canvas.width above wipes the bitmap. While the loop is
        // running the next frame redraws it, but on the game-over screen
        // nothing is scheduled -- so a rotate/resize there would leave a
        // blank canvas until someone tapped to retry.
        if (isGameOver) paint();
    }

    // The cart, drawn on the 60x46 sprite grid facing right.
    //
    // The shape follows a real cart's side profile rather than a filled
    // rectangle: a thin floor deck carried on two chunky wheels, an OPEN
    // cabin you can see straight through (canopy on two posts, seat back
    // and steering column standing in the gap), and the bag deck slung
    // off the back behind the rear post with clubs poking up. The open
    // cabin and the tail-hung bag are what actually make it read as a
    // golf cart -- the previous solid slab read as a bench.
    //
    // `flip` mirrors it to face left, so hazards look like oncoming
    // traffic instead of carts driving backwards.
    // Nothing is thinner than 3 grid units, so it survives the 0.62
    // scale a narrow phone gets.
    function drawCart(x, y, p, flip) {
        ctx.save();
        ctx.translate(x + (flip ? SPRITE_W * S : 0), y);
        if (flip) ctx.scale(-1, 1);
        const r = (a, b, w, h) => ctx.fillRect(a * S, b * S, w * S, h * S);
        const disc = (cx, cy, rad, fill) => {
            ctx.beginPath();
            ctx.arc(cx * S, cy * S, rad * S, 0, Math.PI * 2);
            ctx.fillStyle = fill;
            ctx.fill();
        };

        // Canopy: lit top face over a shaded underside
        ctx.fillStyle = p.roof; r(16, 0, 38, 3);
        ctx.fillStyle = p.post; r(18, 3, 34, 2);

        // Canopy posts -- rear and front, framing the open cabin
        ctx.fillStyle = p.post; r(19, 5, 3, 18); r(48, 5, 3, 22);

        // Clubs and bag, slung off the tail behind the rear post
        ctx.fillStyle = p.bagTrim; r(4, 6, 3, 7); r(8, 8, 3, 5);
        ctx.fillStyle = p.bag; r(2, 13, 11, 16);
        ctx.fillStyle = p.bagTrim; r(2, 17, 11, 3);

        // Seat: upright back and cushion, standing in the open cabin
        ctx.fillStyle = p.bodyDark; r(25, 10, 4, 13); r(25, 19, 15, 4);

        // Steering wheel and column
        ctx.fillStyle = p.post; r(42, 13, 6, 2); r(44, 15, 3, 6);

        // Body, stepped rather than a single plank: a tall seat box in the
        // middle, a low deck off the tail and a lower nose out front. The
        // steps are what stop the silhouette reading as a tabletop.
        ctx.fillStyle = p.bodyLight; r(14, 23, 34, 2);
        ctx.fillStyle = p.body; r(14, 25, 34, 6);
        ctx.fillStyle = p.bodyDark; r(14, 31, 34, 2);

        ctx.fillStyle = p.body; r(2, 29, 12, 2);          // tail deck
        ctx.fillStyle = p.bodyDark; r(2, 31, 12, 2);

        ctx.fillStyle = p.bodyLight; r(48, 27, 10, 2);    // nose
        ctx.fillStyle = p.body; r(48, 29, 10, 2);
        ctx.fillStyle = p.bodyDark; r(48, 31, 10, 2);

        // Round wheels -- square ones were what made this read as
        // furniture rather than a vehicle.
        disc(14, 39.5, 6.5, p.wheel);
        disc(45, 39.5, 6.5, p.wheel);
        disc(14, 39.5, 2.5, p.hub);
        disc(45, 39.5, 2.5, p.hub);

        ctx.restore();
    }

    // Obstacle Class
    class Obstacle {
        constructor() {
            this.x = VIEW_W;
            this.width = SPRITE_W * S;
            this.height = SPRITE_H * S;
            this.y = GROUND - this.height;
        }
        update() { this.x -= baseSpeed * speedMult; }
        draw() { drawCart(this.x, this.y, CART_HAZARD, true); }
    }

    // Input Listeners
    function poke(e) {
        if (e) e.preventDefault();  // don't scroll the page out from under the game
        if (isGameOver) resetGame();
        else player.jump();
    }
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') poke(e); });
    window.addEventListener('touchstart', poke, { passive: false });
    canvas.addEventListener('mousedown', poke);
    window.addEventListener('resize', resize);

    // The ground: a hairline with scrolling dashes, which is what sells
    // the sense of speed now that the scene has no other scenery.
    function drawGround() {
        ctx.fillStyle = 'rgba(236, 229, 213, 0.14)';
        ctx.fillRect(0, GROUND, VIEW_W, 1);

        const gap = 56 * S;
        if (!isGameOver) groundScroll = (groundScroll + baseSpeed * speedMult) % gap;
        ctx.fillStyle = 'rgba(236, 229, 213, 0.07)';
        for (let x = -gap; x < VIEW_W + gap; x += gap) {
            ctx.fillRect(x - groundScroll, GROUND + 7 * S, 22 * S, 1);
        }
    }

    function handleObstacles() {
        // Random spawn cadence, but never closer than a jump-arc's worth
        // of road -- without the gap check two carts can land a frame
        // apart and form a wall nothing can clear.
        const last = obstacles[obstacles.length - 1];
        const minGap = (2 * Math.abs(player.jumpForce) / player.gravity) * baseSpeed * speedMult + player.width;
        if ((!last || last.x < VIEW_W - minGap) && frames % Math.floor(Math.random() * 60 + 80) === 0) {
            obstacles.push(new Obstacle());
        }

        for (let i = 0; i < obstacles.length; i++) {
            const obs = obstacles[i];
            if (!isGameOver) obs.update();
            obs.draw();

            // Collision (AABB), padded so a near-miss over the roof reads
            // as a near-miss rather than a hit.
            const padX = 8 * S, padY = 6 * S;
            if (player.x < obs.x + obs.width - padX &&
                player.x + player.width - padX > obs.x &&
                player.y < obs.y + obs.height - padY &&
                player.y + player.height - padY > obs.y) {
                isGameOver = true;
            }

            if (obs.x + obs.width < 0) { obstacles.splice(i, 1); i--; }
        }
    }

    function setTracked(font, size, spacing) {
        ctx.font = `${font === FONT_DISPLAY ? 300 : 500} ${size}px ${font}`;
        if ('letterSpacing' in ctx) ctx.letterSpacing = spacing;
    }

    function drawUI() {
        // Text scales more gently than the scene -- shrinking it all the
        // way down with S would leave it unreadable on a phone.
        const t = Math.max(0.78, S);
        const scoreLine = `SCORE ${String(Math.floor(score)).padStart(3, '0')}`;

        if (!isGameOver) {
            ctx.textAlign = 'left';
            ctx.fillStyle = MUTED;
            setTracked(FONT_MONO, 11 * t, '2px');
            ctx.fillText(scoreLine, 0, 14 * t);
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
            return;
        }

        // No scrim rectangle -- that painted the canvas box in a slightly
        // different green to the page behind it, showing exactly where
        // the canvas ended. The scene is ghosted back in animate()
        // instead, so the panel floats on the page's own gradient.
        // A narrow stage has far less headroom above the ground line, and
        // the panel needs three lines there instead of two -- so it sits
        // higher, clear of the ghosted carts.
        const narrow = VIEW_W < 520;
        const titleY = GROUND * (narrow ? 0.36 : 0.52);

        ctx.textAlign = 'center';
        ctx.fillStyle = INK;
        setTracked(FONT_DISPLAY, 46 * t, '0px');
        ctx.fillText('Out of bounds', VIEW_W / 2, titleY);

        ctx.fillStyle = MUTED;
        setTracked(FONT_MONO, 11 * t, '2px');
        if (narrow) {
            ctx.fillText(scoreLine, VIEW_W / 2, titleY + 20 * t);
            ctx.fillText('TAP TO RETRY', VIEW_W / 2, titleY + 36 * t);
        } else {
            ctx.fillText(`${scoreLine}  ·  TAP OR SPACE TO RETRY`, VIEW_W / 2, titleY + 28 * t);
        }
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        ctx.textAlign = 'left';
    }

    function resetGame() {
        player.y = GROUND - player.height;
        player.dy = 0;
        player.grounded = true;
        obstacles = [];
        score = 0;
        speedMult = 1;
        frames = 0;
        isGameOver = false;
        animate();
    }

    // One full frame. Idempotent once isGameOver is set (nothing moves,
    // the score stops accruing), so it doubles as the repaint for resize
    // and late-loading fonts.
    function paint() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);

        // On game over the scene ghosts out behind the panel instead of
        // being covered by an opaque rectangle.
        ctx.globalAlpha = isGameOver ? 0.16 : 1;
        drawGround();
        player.update();
        player.draw();
        handleObstacles();
        ctx.globalAlpha = 1;

        drawUI();
    }

    function animate() {
        paint();

        if (!isGameOver) {
            score += 0.1;
            frames++;
            if (frames > 0 && frames % 300 === 0 && speedMult < 3) speedMult += 0.1;
            requestAnimationFrame(animate);
        } else {
            // The collision is detected *during* the paint above, so that
            // frame drew the scene at full opacity before the panel went
            // on top. One more pass now that the flag is set gives the
            // ghosted-back scene the panel is designed to sit on.
            paint();
        }
    }

    resize();
    animate();
    // Repaint the panel once the webfonts land, so a game that ended
    // before they loaded isn't stuck on the fallback face.
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (isGameOver) paint(); });
    }
</script>

</body>
